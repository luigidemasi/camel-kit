# ─── Camel Kit Configuration ────────────────────────────────────────────────
#
# Single source of truth for all configurable values.
# Read at build time by Maven (via properties-maven-plugin)
# and at runtime by DistributionConfig (packaged in the JAR classpath).

# ─── Per-Platform Camel Versions ────────────────────────────────────────────
#
# Each platform has its own default Camel version because release schedules
# differ. Quarkus typically lags behind the main Camel release.

# Main / JBang runtime
camel.main.version=4.20.0

# Spring Boot runtime
camel.springboot.version=4.20.0
springboot.bom.version=4.20.0

# Quarkus runtime
camel.quarkus.version=4.18.0
quarkus.platform.version=3.33.1

# ─── Supported Versions Per Platform ────────────────────────────────────────
#
# Comma-separated list of supported Camel versions per runtime.
# Shown to the user during /camel-design version selection.
camel.main.supported=4.20.0,4.18.2,4.14.7
camel.springboot.supported=4.20.0,4.18.2,4.14.7
camel.quarkus.supported=4.18.0,4.14.7

# ─── Quarkus Platform BOM Mapping ──────────────────────────────────────────
#
# Maps each supported Camel Quarkus version to its Quarkus platform BOM version.
quarkus.platform.4.18.0=3.33.1
quarkus.platform.4.14.7=3.27.3

# ─── MCP Server Versions ───────────────────────────────────────────────────
camel.mcp.version=4.20.0
knowledge.mcp.version=0.0.1-SNAPSHOT
dispatch.mcp.version=0.3.2-SNAPSHOT

# ─── MCP Repos ─────────────────────────────────────────────────────────────
camel.mcp.repos=central=https://repo1.maven.org/maven2/,apache_snap=https://repository.apache.org/snapshots,apache=https://repository.apache.org/
knowledge.mcp.repos=central=https://repo1.maven.org/maven2/
camel.catalog.repos=https://repository.apache.org/

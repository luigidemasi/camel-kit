name: Build

on:
  push:
    branches:
      - main
      - release
      - 'release/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [17, 21, 25]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap \
            --unshare-user --unshare-net --disable-userns \
            --dir /usr --dir /opt \
            --ro-bind /usr/lib /usr/lib --ro-bind /usr/lib64 /usr/lib64 \
            --ro-bind "$JAVA_HOME" /opt/jdk \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev -- /opt/jdk/bin/java -version

      - name: Check code formatting and imports
        run: ./mvnw -B -Psourcecheck validate

      - name: Build and certify Ship payloads
        run: ./mvnw -B -V -Plinux-ship-certification -Dformat.skip=true clean install

      - name: Upload build artifacts
        if: success() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-java${{ matrix.java }}-${{ github.sha }}
          path: |
            camel-kit-main/target/*.jar
            camel-kit-core/target/*.jar
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}-${{ github.sha }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

  comment-pr:
    name: Comment PR Status
    runs-on: ubuntu-latest
    needs: build
    # Fork PRs run with a read-only GITHUB_TOKEN, so posting the comment would 403.
    if: github.event_name == 'pull_request' && always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with build status
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const success = buildResult === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'successful' : 'failed';

            const message = `${emoji} Build ${status} for commit ${context.sha.substring(0, 7)}

            **Java Version Tests:**
            All Java versions (17, 21, 25) ${success ? 'passed ✅' : 'had failures ❌'}

            ${success ? 'Build artifacts are available in the workflow run.' : `Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

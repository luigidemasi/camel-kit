    target: .claude/camel-kit-personas/code-quality-reviewer.md
  - source: agents/critic-behavioral-equivalence.md
    target: .claude/camel-kit-personas/critic-behavioral-equivalence.md
  - source: agents/critic-boundary-compliance.md
    target: .claude/camel-kit-personas/critic-boundary-compliance.md
  - source: agents/critic-performance.md
    target: .claude/camel-kit-personas/critic-performance.md
  - source: agents/critic-route-architecture.md
    target: .claude/camel-kit-personas/critic-route-architecture.md
  - source: agents/critic-security.md
    target: .claude/camel-kit-personas/critic-security.md
  - source: agents/implementation-engineer.md

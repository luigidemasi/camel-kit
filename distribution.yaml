distribution: community

# Version defaults
camel-version: "4.14.4"
springboot-bom-version: "4.14.4"
quarkus-bom-version: "3.27.2"

# Maven coordinates
maven-repo: "https://repo.maven.apache.org/maven2/"
springboot-bom-groupId: "org.apache.camel.springboot"
quarkus-bom-groupId: "io.quarkus.platform"

# Governance
iron-laws: community
rule7: catalog-exists

# Knowledge layer
knowledge-tools: community

# Branding
product-name: "Apache Camel"

# Version mapping (empty for community — versions used as-is)
version-map: {}

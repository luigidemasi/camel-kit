[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camel-kit-cli"
version = "0.1.2"
description = "Camel-Kit CLI: A toolkit for designing Apache Camel integrations with AI coding assistants"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Apache Camel Community" }
]
keywords = [
    "apache-camel",
    "integration",
    "camel",
    "ai",
    "coding-assistant",
    "spec-driven-development"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
camel-kit = "camel_kit_cli:main"

[project.urls]
Homepage = "https://github.com/apache/camel-kit"
Documentation = "https://camel.apache.org/camel-kit"
Repository = "https://github.com/apache/camel-kit"
Issues = "https://github.com/apache/camel-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/camel_kit_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

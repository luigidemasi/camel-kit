# Citrus Integration Test for: order-ingestion
# Generated by camel-kit
#
# Prerequisites:
#   camel plugin add test
#
# Run with:
#   camel test run test/order-ingestion.camel.it.yaml
#
# Or start infra separately:
#   camel infra run kafka
#   camel infra run postgres
#   camel test run test/order-ingestion.camel.it.yaml

name: "order-ingestion-integration-test"
description: "Integration tests for order-ingestion route"

# ============================================
# VARIABLES
# ============================================
variables:
  kafka.topic.input: "orders"
  kafka.topic.dlq: "orders-dlq"

# ============================================
# TEST ACTIONS
# ============================================
actions:

  # ------------------------------------------
  # Start Infrastructure (Testcontainers)
  # ------------------------------------------
  - testcontainers:
      start:
        kafka: {}

  - testcontainers:
      start:
        postgresql:
          env:
            POSTGRES_DB: "orders"
            POSTGRES_USER: "orderuser"
            POSTGRES_PASSWORD: "orderpass123"
          initScript: "../init-db.sql"

  # ------------------------------------------
  # Start the Camel Integration
  # ------------------------------------------
  - camel:
      jbang:
        run:
          integration:
            file: "../routes.camel.yaml"
          wait: 5000  # Wait for route to start

  # ------------------------------------------
  # TEST 1: Happy Path
  # ------------------------------------------
  - echo:
      message: "━━━ Test 1: Happy Path ━━━"

  # Send valid order message to Kafka
  - send:
      endpoint: "kafka:${kafka.topic.input}"
      message:
        body:
          file: "data/order-valid.json"
        headers:
          - name: "citrus_kafka_messageKey"
            value: "ORD-001"
          - name: "contentType"
            value: "application/json"

  # Wait for processing
  - sleep:
      milliseconds: 3000

  # Verify order was persisted to database
  - sql:
      datasource: "ordersdb"
      statements:
        - "SELECT * FROM orders WHERE order_id = 'ORD-001'"
      validate:
        - column: "order_id"
          value: "ORD-001"
        - column: "status"
          value: "RECEIVED"
        - column: "customer_id"
          value: "CUST-123"
        - column: "amount"
          value: "75.50"
        - column: "currency"
          value: "EUR"

  - echo:
      message: "✅ Happy path test PASSED"

  # ------------------------------------------
  # TEST 2: Filter Rejection
  # ------------------------------------------
  - echo:
      message: "━━━ Test 2: Filter Rejection ━━━"

  # Send order that should be filtered (amount < 50)
  - send:
      endpoint: "kafka:${kafka.topic.input}"
      message:
        body:
          file: "data/order-filtered.json"
        headers:
          - name: "citrus_kafka_messageKey"
            value: "ORD-002"

  # Wait for processing
  - sleep:
      milliseconds: 3000

  # Verify order was NOT persisted (filtered out)
  - sql:
      datasource: "ordersdb"
      statements:
        - "SELECT COUNT(*) as cnt FROM orders WHERE order_id = 'ORD-002'"
      validate:
        - column: "cnt"
          value: "0"

  - echo:
      message: "✅ Filter rejection test PASSED - order correctly filtered out"

  # ------------------------------------------
  # TEST 3: Large Order
  # ------------------------------------------
  - echo:
      message: "━━━ Test 3: Large Order ━━━"

  # Send large order
  - send:
      endpoint: "kafka:${kafka.topic.input}"
      message:
        body:
          file: "data/order-large.json"
        headers:
          - name: "citrus_kafka_messageKey"
            value: "ORD-003"

  # Wait for processing
  - sleep:
      milliseconds: 3000

  # Verify order was persisted
  - sql:
      datasource: "ordersdb"
      statements:
        - "SELECT * FROM orders WHERE order_id = 'ORD-003'"
      validate:
        - column: "status"
          value: "RECEIVED"
        - column: "amount"
          value: "299.95"

  - echo:
      message: "✅ Large order test PASSED"

  # ------------------------------------------
  # TEST 4: Edge Case - Exactly 50 EUR
  # ------------------------------------------
  - echo:
      message: "━━━ Test 4: Edge Case (50 EUR threshold) ━━━"

  # Send order with exactly 50 EUR
  - send:
      endpoint: "kafka:${kafka.topic.input}"
      message:
        body:
          data: |
            {
              "orderId": "ORD-EDGE",
              "customerId": "CUST-EDGE",
              "amount": 50.00,
              "currency": "EUR",
              "status": "PENDING",
              "items": [
                {"productId": "PROD-1", "productName": "Test Item", "quantity": 1, "unitPrice": 50.00}
              ]
            }
        headers:
          - name: "citrus_kafka_messageKey"
            value: "ORD-EDGE"

  # Wait for processing
  - sleep:
      milliseconds: 3000

  # Verify order was persisted (50 >= 50, so it passes)
  - sql:
      datasource: "ordersdb"
      statements:
        - "SELECT * FROM orders WHERE order_id = 'ORD-EDGE'"
      validate:
        - column: "status"
          value: "RECEIVED"

  - echo:
      message: "✅ Edge case test PASSED - 50 EUR order processed"

  # ------------------------------------------
  # TEST 5: Dead Letter Queue
  # ------------------------------------------
  - echo:
      message: "━━━ Test 5: Dead Letter Queue ━━━"

  # Send invalid/malformed message
  - send:
      endpoint: "kafka:${kafka.topic.input}"
      message:
        body:
          data: |
            {
              "orderId": "",
              "customerId": null,
              "amount": "invalid-not-a-number",
              "currency": "EUR"
            }
        headers:
          - name: "citrus_kafka_messageKey"
            value: "TEST-INVALID"

  # Verify message appears in DLQ topic
  - receive:
      endpoint: "kafka:${kafka.topic.dlq}"
      timeout: 15000
      message:
        headers:
          - name: "citrus_kafka_messageKey"
            value: "TEST-INVALID"

  - echo:
      message: "✅ DLQ test PASSED - invalid message routed to dead letter queue"

  # ------------------------------------------
  # CLEANUP
  # ------------------------------------------
  - echo:
      message: "━━━ Cleanup ━━━"

  - sql:
      datasource: "ordersdb"
      statements:
        - "DELETE FROM orders WHERE order_id LIKE 'ORD-%' OR order_id LIKE 'TEST-%'"

  - echo:
      message: "━━━ Test suite completed ━━━"

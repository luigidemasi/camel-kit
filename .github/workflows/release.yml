name: Publish Maven Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prepared release tag (for example, camel-kit-0.4.0)'
        required: true
        type: string
      expected_sha:
        description: 'Full commit SHA reviewed and tagged for this release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^camel-kit-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$EXPECTED_SHA" ]]
          version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = "{http://maven.apache.org/POM/4.0.0}"
          root = ET.parse("pom.xml").getroot()
          version = root.findtext(ns + "version", default="")
          for entry in root.findall(f"{ns}modules/{ns}module"):
              path = f"{entry.text}/pom.xml"
              module = ET.parse(path).getroot()
              parent_version = module.findtext(f"{ns}parent/{ns}version")
              if parent_version != version or module.findtext(ns + "version", parent_version) != version:
                  raise SystemExit(f"{path}: release module and parent versions must match {version}")
          print(version)
          PY
          )
          [[ "$RELEASE_TAG" == "camel-kit-$version" ]]

      - name: Set up JDK 17 and Maven Central settings
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Prepare release signing
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_ID: ${{ secrets.GPG_ID }}
          MAVEN_USERNAME: ${{ secrets.MVN_CENTRAL_USER }}
          MAVEN_PASSWORD: ${{ secrets.MVN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GPG_KEY:?Configure the GPG_KEY secret with the base64-encoded signing key}"
          : "${GPG_ID:?Configure the GPG_ID signing-key secret}"
          : "${MAVEN_USERNAME:?Configure the MVN_CENTRAL_USER secret}"
          : "${MAVEN_PASSWORD:?Configure the MVN_CENTRAL_PASSWORD secret}"
          export GNUPGHOME="$RUNNER_TEMP/camel-kit-release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | base64 --decode | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Test, sign and publish release artifacts
        env:
          GPG_ID: ${{ secrets.GPG_ID }}
          MAVEN_USERNAME: ${{ secrets.MVN_CENTRAL_USER }}
          MAVEN_PASSWORD: ${{ secrets.MVN_CENTRAL_PASSWORD }}
        run: ./.github/workflows/release.sh

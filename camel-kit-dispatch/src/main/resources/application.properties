quarkus.mcp.server.server-info.name=camel-kit-dispatch
quarkus.mcp.server.server-info.version=1.0.0

# Disable banner - stdio MCP requires clean JSON-RPC on stdout
quarkus.banner.enabled=false

# HTTP disabled by default - stdio is the primary transport
quarkus.http.port=-1

# Build uber-jar for jbang execution
quarkus.package.jar.type=uber-jar

# Dispatch defaults
dispatch.bob-path=bob
dispatch.default-timeout-seconds=300
dispatch.max-concurrent=4

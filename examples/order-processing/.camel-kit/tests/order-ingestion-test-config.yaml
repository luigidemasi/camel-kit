# Test run configuration for order-ingestion
# Run with: camel test run --config .camel-kit/tests/order-ingestion-test-config.yaml

test:
  file: "order-ingestion-test.yaml"
  timeout: 120000  # 2 minutes max per test

# Override variables for different environments
environments:
  local:
    kafka.bootstrap.servers: "localhost:9092"
    kafka.topic.input: "orders"
    kafka.topic.dlq: "orders-dlq"
    database.url: "jdbc:postgresql://localhost:5432/orders"
    database.username: "orderuser"
    database.password: "orderpass123"

  docker:
    kafka.bootstrap.servers: "kafka:9092"
    database.url: "jdbc:postgresql://postgres:5432/orders"
    database.username: "orderuser"
    database.password: "orderpass123"

  ci:
    kafka.bootstrap.servers: "${KAFKA_BROKERS}"
    kafka.topic.input: "${KAFKA_TOPIC_ORDERS:-orders}"
    kafka.topic.dlq: "${KAFKA_TOPIC_DLQ:-orders-dlq}"
    database.url: "${DATABASE_URL}"
    database.username: "${DATABASE_USER}"
    database.password: "${DATABASE_PASSWORD}"

# Testcontainers settings
testcontainers:
  enabled: true
  reuse: false  # Set to true for faster local development

# Reporting configuration
reports:
  - format: junit
    output: ".camel-kit/tests/reports/junit.xml"
  - format: html
    output: ".camel-kit/tests/reports/report.html"
  - format: json
    output: ".camel-kit/tests/reports/results.json"

# Test execution settings
execution:
  parallel: false  # Run tests sequentially
  stopOnFailure: false  # Continue running remaining tests after failure
  retryOnFailure: 1  # Retry failed tests once

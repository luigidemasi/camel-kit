id: pi
displayName: Pi
commandDirectory: .pi/prompts
skillsDirectory: .pi/skills
generatesCommandStubs: true
commandFileFormat: md
argumentPlaceholder: $ARGUMENTS
mcpConfigPath: .mcp.json
mcpConfigTemplatePath: templates/mcp-configs/pi-mcp.json
mcpConfigFormat: json
mcpServerContainerKey: mcpServers
description: Pi terminal coding agent
generatorStrategy: pi
dispatchTemplatePath: templates/dispatch/pi.md
templates:
  - source: templates/pi/agents-md.md
    target: AGENTS.md
  - source: templates/pi/extensions/camel-kit-guard.ts
    target: .pi/extensions/camel-kit-guard.ts
  - source: templates/pi/extensions/camel-kit-guard-policy.json
    target: .pi/camel-kit-guard-policy.json
  - source: agents/acr-moderator.md
    target: .pi/camel-kit-personas/acr-moderator.md
  - source: agents/catalog-researcher.md
    target: .pi/camel-kit-personas/catalog-researcher.md
  - source: agents/code-quality-reviewer.md
    target: .pi/camel-kit-personas/code-quality-reviewer.md
  - source: agents/critic-behavioral-equivalence.md
    target: .pi/camel-kit-personas/critic-behavioral-equivalence.md
  - source: agents/critic-boundary-compliance.md
    target: .pi/camel-kit-personas/critic-boundary-compliance.md
  - source: agents/critic-performance.md
    target: .pi/camel-kit-personas/critic-performance.md
  - source: agents/critic-route-architecture.md
    target: .pi/camel-kit-personas/critic-route-architecture.md
  - source: agents/critic-security.md
    target: .pi/camel-kit-personas/critic-security.md
  - source: agents/implementation-engineer.md
    target: .pi/camel-kit-personas/implementation-engineer.md
  - source: agents/integration-architect.md
    target: .pi/camel-kit-personas/integration-architect.md
  - source: agents/knowledge-researcher.md
    target: .pi/camel-kit-personas/knowledge-researcher.md
  - source: agents/migration-specialist.md
    target: .pi/camel-kit-personas/migration-specialist.md
  - source: agents/spec-compliance-reviewer.md
    target: .pi/camel-kit-personas/spec-compliance-reviewer.md
  - source: agents/test-engineer.md
    target: .pi/camel-kit-personas/test-engineer.md
supportsSubagents: false
supportsTraits: true
capabilities:
  - project-skills
  - prompt-templates
  - instruction-files
  - mcp
  - hooks

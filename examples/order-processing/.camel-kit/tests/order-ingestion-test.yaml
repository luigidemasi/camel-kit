# Citrus Integration Test for: order-ingestion
# Generated by camel-kit
#
# Run with: camel test run .camel-kit/tests/order-ingestion-test.yaml
# Open in Kaoto for visual editing

name: "order-ingestion-integration-test"
description: "Integration tests for order-ingestion route"

# Test variables - override via environment or command line
variables:
  kafka.bootstrap.servers: "localhost:9092"
  kafka.topic.input: "orders"
  kafka.topic.dlq: "orders-dlq"
  kafka.consumer.group: "order-processor"
  database.url: "jdbc:postgresql://localhost:5432/orders"
  database.username: "orderuser"
  database.password: "orderpass123"

# Testcontainers configuration
testcontainers:
  kafka:
    image: "apache/kafka:latest"
    exposedPorts:
      - 9092
    env:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    waitStrategy:
      type: log
      regex: "Kafka Server started"

  postgres:
    image: "postgres:16"
    exposedPorts:
      - 5432
    env:
      POSTGRES_DB: orders
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass123
    initScript: "../../init-db.sql"
    waitStrategy:
      type: port
      port: 5432

# Test suite
tests:

  # ============================================
  # TEST CASE 1: Happy Path
  # ============================================
  - name: "happy-path"
    description: "Valid order with amount >= 50 EUR flows through successfully"
    actions:
      - echo:
          message: "━━━ Test Case 1: Happy Path ━━━"

      # Send valid order message to Kafka
      - send:
          endpoint:
            kafka:
              topic: "${kafka.topic.input}"
              bootstrapServers: "${kafka.bootstrap.servers}"
          message:
            body:
              file: "test-data/order-valid.json"
            headers:
              correlationId: "test-happy-001"
              contentType: "application/json"

      # Wait for processing
      - sleep:
          milliseconds: 3000

      # Verify order was persisted to database
      - query:
          datasource: "ordersdb"
          statement: "SELECT * FROM orders WHERE order_id = 'ORD-001'"
          validate:
            - column: "status"
              value: "RECEIVED"
            - column: "customer_id"
              value: "CUST-123"
            - column: "amount"
              value: 75.50
            - column: "currency"
              value: "EUR"

      - echo:
          message: "✅ Happy path test PASSED"

  # ============================================
  # TEST CASE 2: Filter - Message Rejected
  # ============================================
  - name: "filter-rejected"
    description: "Order with amount < 50 EUR is filtered out and not persisted"
    actions:
      - echo:
          message: "━━━ Test Case 2: Filter Rejection ━━━"

      # Send order that should be filtered (amount < 50)
      - send:
          endpoint:
            kafka:
              topic: "${kafka.topic.input}"
              bootstrapServers: "${kafka.bootstrap.servers}"
          message:
            body:
              file: "test-data/order-filtered.json"
            headers:
              correlationId: "test-filter-001"

      # Wait for processing
      - sleep:
          milliseconds: 3000

      # Verify order was NOT persisted (filtered out)
      - query:
          datasource: "ordersdb"
          statement: "SELECT COUNT(*) as cnt FROM orders WHERE order_id = 'ORD-002'"
          validate:
            - column: "cnt"
              value: 0

      - echo:
          message: "✅ Filter rejection test PASSED - order correctly filtered out"

  # ============================================
  # TEST CASE 3: Large Order
  # ============================================
  - name: "large-order"
    description: "Large order with multiple items is processed correctly"
    actions:
      - echo:
          message: "━━━ Test Case 3: Large Order ━━━"

      # Send large order
      - send:
          endpoint:
            kafka:
              topic: "${kafka.topic.input}"
              bootstrapServers: "${kafka.bootstrap.servers}"
          message:
            body:
              file: "test-data/order-large.json"
            headers:
              correlationId: "test-large-001"

      # Wait for processing
      - sleep:
          milliseconds: 3000

      # Verify order was persisted
      - query:
          datasource: "ordersdb"
          statement: "SELECT * FROM orders WHERE order_id = 'ORD-003'"
          validate:
            - column: "status"
              value: "RECEIVED"
            - column: "amount"
              value: 299.95

      - echo:
          message: "✅ Large order test PASSED"

  # ============================================
  # TEST CASE 4: Edge Case - Exactly 50 EUR
  # ============================================
  - name: "edge-case-threshold"
    description: "Order with exactly 50 EUR passes the filter"
    actions:
      - echo:
          message: "━━━ Test Case 4: Edge Case (50 EUR threshold) ━━━"

      # Send order with exactly 50 EUR
      - send:
          endpoint:
            kafka:
              topic: "${kafka.topic.input}"
              bootstrapServers: "${kafka.bootstrap.servers}"
          message:
            body: |
              {
                "orderId": "ORD-EDGE",
                "customerId": "CUST-EDGE",
                "amount": 50.00,
                "currency": "EUR",
                "status": "PENDING",
                "items": [
                  {"productId": "PROD-1", "productName": "Test Item", "quantity": 1, "unitPrice": 50.00}
                ]
              }
            headers:
              correlationId: "test-edge-001"

      # Wait for processing
      - sleep:
          milliseconds: 3000

      # Verify order was persisted (50 >= 50, so it passes)
      - query:
          datasource: "ordersdb"
          statement: "SELECT * FROM orders WHERE order_id = 'ORD-EDGE'"
          validate:
            - column: "status"
              value: "RECEIVED"

      - echo:
          message: "✅ Edge case test PASSED - 50 EUR order processed"

  # ============================================
  # TEST CASE 5: Dead Letter Queue
  # ============================================
  - name: "dead-letter-queue"
    description: "Invalid/malformed message is routed to DLQ"
    actions:
      - echo:
          message: "━━━ Test Case 5: Dead Letter Queue ━━━"

      # Send invalid/malformed message
      - send:
          endpoint:
            kafka:
              topic: "${kafka.topic.input}"
              bootstrapServers: "${kafka.bootstrap.servers}"
          message:
            body: |
              {
                "orderId": "",
                "customerId": null,
                "amount": "invalid-not-a-number",
                "currency": "EUR"
              }
            headers:
              correlationId: "test-dlq-001"

      # Receive from DLQ (with timeout)
      - receive:
          endpoint:
            kafka:
              topic: "${kafka.topic.dlq}"
              bootstrapServers: "${kafka.bootstrap.servers}"
              groupId: "test-consumer"
          timeout: 15000
          selector:
            correlationId: "test-dlq-001"

      - echo:
          message: "✅ DLQ test PASSED - invalid message routed to dead letter queue"

# Cleanup actions (always run)
finally:
  - echo:
      message: "Cleaning up test data..."

  - query:
      datasource: "ordersdb"
      statement: "DELETE FROM orders WHERE order_id LIKE 'ORD-%' OR order_id LIKE 'TEST-%'"

  - echo:
      message: "━━━ Test suite completed ━━━"

name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [17, 21, 25]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean install -B -V

      - name: Run tests
        run: ./mvnw test -B

      - name: Verify package
        run: ./mvnw verify -B

      - name: Upload build artifacts
        if: success() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-java${{ matrix.java }}-${{ github.sha }}
          path: |
            camel-kit-main/target/*.jar
            camel-kit-core/target/*.jar
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}-${{ github.sha }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

  comment-pr:
    name: Comment PR Status
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment PR with build status
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const success = buildResult === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'successful' : 'failed';

            const message = `${emoji} Build ${status} for commit ${context.sha.substring(0, 7)}

            **Java Version Tests:**
            All Java versions (17, 21, 25) ${success ? 'passed ✅' : 'had failures ❌'}

            ${success ? 'Build artifacts are available in the workflow run.' : `Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
